name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows
            geode-target: Win64
          - os: ubuntu-latest
            target: Android64
            geode-target: Android64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.geode-target }}
          sdk: latest
          combine: true
      - uses: actions/upload-artifact@v4
        with:
          name: gd-ai-builder-${{ matrix.target }}
          path: ./build/*.geode
          if-no-files-found: error
