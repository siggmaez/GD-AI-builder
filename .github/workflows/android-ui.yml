name: Android bridge UI compile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-ui.yml']
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      # Compile-only check. No runtime-less APK is published or presented as usable.
      - name: Check Android interface and embedded Python integration
        working-directory: android-app
        run: gradle :app:assembleDebug
