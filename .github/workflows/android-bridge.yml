name: Android phone bridge

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: 'Reuse native Codex artifacts from a successful run (optional)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-bridge.yml']

jobs:
  codex-android:
    if: ${{ !inputs.native_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            compiler: aarch64-linux-android26-clang
          - target: x86_64-linux-android
            abi: x86_64
            compiler: x86_64-linux-android26-clang
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: rust-v0.162.1
          path: upstream-codex
      - name: Install Rust and Android target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream-codex/codex-rs
          key: android-${{ matrix.abi }}
          cache-on-failure: true
      - name: Configure native Android build
        run: |
          python android-app/prepare_codex.py upstream-codex/codex-rs
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          target='${{ matrix.target }}'
          upper="${target^^}"
          upper="${upper//-/_}"
          lower="${target//-/_}"
          echo "CARGO_TARGET_${upper}_LINKER=$toolchain/${{ matrix.compiler }}" >> "$GITHUB_ENV"
          echo "CC_${lower}=$toolchain/${{ matrix.compiler }}" >> "$GITHUB_ENV"
          echo "AR_${lower}=$toolchain/llvm-ar" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$toolchain" >> "$GITHUB_PATH"
      - name: Compile official Codex CLI for Android arm64
        working-directory: upstream-codex/codex-rs
        run: cargo +1.95.0 build -p codex-cli --bin codex --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: codex-${{ matrix.abi }}
          path: |
            upstream-codex/codex-rs/target/${{ matrix.target }}/debug/codex
            upstream-codex/LICENSE
            upstream-codex/NOTICE
  apk:
    needs: codex-android
    if: ${{ always() && (needs.codex-android.result == 'success' || needs.codex-android.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - uses: actions/download-artifact@v4
        with:
          pattern: 'codex-*'
          path: native
          run-id: ${{ inputs.native_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Package native runtimes and licenses
        shell: bash
        run: |
          for abi in arm64-v8a x86_64; do
            mkdir -p "android-app/app/src/main/jniLibs/$abi"
            binary=$(find "native/codex-$abi" -name codex -type f | head -n 1)
            test -n "$binary"
            cp "$binary" "android-app/app/src/main/jniLibs/$abi/libcodex.so"
          done
          mkdir -p android-app/app/src/main/assets/licenses
          find native/codex-arm64-v8a -name LICENSE -exec cp '{}' android-app/app/src/main/assets/licenses/Codex-LICENSE ';'
          find native/codex-arm64-v8a -name NOTICE -exec cp '{}' android-app/app/src/main/assets/licenses/Codex-NOTICE ';'
      - name: Build Android arm64 phone companion
        working-directory: android-app
        run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Builder-Phone-Bridge-unsigned
          path: android-app/app/build/outputs/apk/release/*unsigned.apk
      - name: Build emulator APK with actual x86_64 Codex runtime
        working-directory: android-app
        run: gradle -PbridgeAbi=x86_64 :app:assembleDebug
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python android-app/tests/smoke.py android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: phone-bridge-ui-preview, path: phone-bridge.png }
