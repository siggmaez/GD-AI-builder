name: Android phone bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android-bridge.yml']

jobs:
  codex-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: rust-v0.162.1
          path: upstream-codex
      - name: Install Rust and Android target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream-codex/codex-rs
          key: android-arm64
          cache-on-failure: true
      - name: Configure native Android build
        run: |
          python android-app/prepare_codex.py upstream-codex/codex-rs
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$toolchain/llvm-ar" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "$toolchain" >> "$GITHUB_PATH"
      - name: Compile official Codex CLI for Android arm64
        working-directory: upstream-codex/codex-rs
        run: cargo +1.95.0 build --locked -p codex-cli --bin codex --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: codex-android-arm64
          path: upstream-codex/codex-rs/target/aarch64-linux-android/debug/codex
